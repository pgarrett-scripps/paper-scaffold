# Runs the gate that `just verify` runs locally, plus the two things a local run
# cannot check: that a FRESH CLONE works, and that the Typst version floor in the
# justfile is real.
#
# Every bug in this repository's history was found by hand-porting the scaffold
# into another manuscript. That is a good way to find bugs and a slow one, and it
# only happens when someone starts a paper.
#
# Tools are installed by curl from pinned release binaries rather than through
# marketplace actions: it is three lines each, it pins exactly what runs, and it
# keeps the supply chain to GitHub releases and astral.sh, which the manuscript
# toolchain already depends on.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JUST_VERSION: 1.58.0
  TYPSTYLE_VERSION: 0.15.1

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from `typst_min` in the justfile, and the newest release.
        # Both, because the two failures are different: an old Typst loses
        # figures from the Word export (see the justfile comment), and a new one
        # changes HTML export in ways typst2docx.py has to keep up with.
        typst: ["0.14.2", "0.15.1"]

    steps:
      # A shallow checkout is fine: no check reads git history any more. Staleness
      # is a content stamp written at build time (`just check-build`), so this
      # needs the files and nothing else.
      - uses: actions/checkout@v4

      # Tools go in a user-owned directory rather than /usr/local/bin, which is
      # not reliably writable across the runner images (and differs again on an
      # arm64 macOS runner). BIN is exported for the install steps below.
      - name: Prepare a bin directory
        run: |
          echo "BIN=$HOME/.local/bin" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install typst ${{ matrix.typst }}
        run: |
          curl -sSL "https://github.com/typst/typst/releases/download/v${{ matrix.typst }}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C "$BIN" --wildcards '*/typst'

      - name: Install just
        run: |
          curl -sSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$BIN" just

      - name: Install typstyle
        run: |
          curl -sSL -o "$BIN/typstyle" \
            "https://github.com/typstyle-rs/typstyle/releases/download/v${TYPSTYLE_VERSION}/typstyle-x86_64-unknown-linux-gnu"
          chmod +x "$BIN/typstyle"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Also the first assertion: doctor must agree the toolchain is usable, and
      # must reject a typst below the floor. Both directions matter, since a
      # version check that never fails is not a check.
      - name: just doctor
        run: just doctor

      - name: Reject a typst below the floor
        run: |
          if just --set typst_min 99.0 doctor; then
            echo "doctor accepted a typst below its own floor"
            exit 1
          fi
          echo "doctor rejects an old typst, as it should"

      - run: just setup

      # Build before verifying, exactly as CLAUDE.md tells a human to. Neither
      # output is tracked, so a fresh clone has neither and `just check` correctly
      # asks for both. Building also writes the .build-stamp that check-build
      # compares against.
      - run: just paper
      - run: just docx

      # The Word export is the part that fails silently rather than loudly, so
      # exiting 0 is not enough of an assertion.
      #
      # Every figure must survive. This is measured on the HTML intermediate
      # rather than the .docx because a count of embedded images cannot tell a
      # figure from a rasterized equation: on typst 0.13 the export drops the
      # figure and keeps both equations, so the .docx still contains images and
      # still looks fine. One <img> per rendered figure is the property that
      # actually distinguishes them.
      #
      # Figures are counted as fig("...") call sites (plus any direct image()
      # calls), with // comments stripped first. The first version counted
      # image() in the sources, which went to zero the day figures moved behind
      # the assets manifest -- a check that compares against zero passes forever.
      # The count therefore also FAILS the step when it finds no figures at all,
      # so it cannot silently die the same way twice.
      - name: Every figure survives the HTML export
        run: |
          typst compile --features html --input docx=true -f html \
            paper.typ "$RUNNER_TEMP/check.html" 2>/dev/null
          calls=$(uv run --quiet python - <<'PY'
          import re
          from pathlib import Path
          src = ""
          for p in ["paper.typ", "si-body.typ", "config.typ",
                    *sorted(map(str, Path("si").glob("*.typ")))]:
              src += "\n" + re.sub(r"//[^\n]*", "", Path(p).read_text())
          print(len(re.findall(r'\bfig\(\s*"', src))
                + len(re.findall(r'\bimage\(\s*"', src)))
          PY
          )
          imgs=$(grep -o '<img' "$RUNNER_TEMP/check.html" | wc -l)
          echo "  figure references in source: $calls, <img> in export: $imgs"
          if [ "$calls" -eq 0 ]; then
            echo "FAIL: found no figure references in the sources. Either the"
            echo "  scaffold really has no figures, or this count no longer"
            echo "  matches how figures are written -- both mean this check is"
            echo "  not checking anything."
            exit 1
          fi
          if [ "$imgs" -lt "$calls" ]; then
            echo "FAIL: the HTML export dropped $((calls - imgs)) figure(s)."
            echo "  The Word export would be produced anyway, look finished, and"
            echo "  be missing plots. This is what typst 0.13 does; see typst_min."
            exit 1
          fi

      - name: The Word export contains the manuscript
        run: |
          uv run --quiet python - <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile("paper.docx")
          doc = z.read("word/document.xml").decode("utf8", "replace")
          media = [n for n in z.namelist() if n.startswith("word/media/")]
          checks = {
              "abstract survived the template bypass": "working skeleton" in doc,
              "section headings survived": "Introduction" in doc and "Methods" in doc,
              "equations were rasterized back in": len(media) > 0,
              "the SI came along": "Supporting Information" in doc,
          }
          for name, ok in checks.items():
              print(("  ok   " if ok else "  FAIL ") + name)
          print(f"  ({len(media)} embedded image(s))")
          sys.exit(0 if all(checks.values()) else 1)
          PY

      - run: just verify

  # A clone is not how anyone starts a paper -- scripts/new-paper.sh is. It runs
  # in `just test` too, but only with --no-build; this is the one place the
  # generated manuscript is actually compiled, which is what a new user does
  # within their first minute.
  new-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tools go in a user-owned directory rather than /usr/local/bin, which is
      # not reliably writable across the runner images (and differs again on an
      # arm64 macOS runner). BIN is exported for the install steps below.
      - name: Prepare a bin directory
        run: |
          echo "BIN=$HOME/.local/bin" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install typst
        run: |
          curl -sSL "https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C "$BIN" --wildcards '*/typst'

      - name: Install just
        run: |
          curl -sSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$BIN" just

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Generate a manuscript and build it
        run: |
          ./scripts/new-paper.sh --yes \
            --title 'A Generated Manuscript' \
            --author 'Ada Lovelace' \
            --email 'ada@example.edu' \
            --affiliation 'Department of Analytical Engines, Example University' \
            "$RUNNER_TEMP/generated"

      # The generated directory must pass the scaffold's own staleness gate
      # immediately. It is the check most likely to be wrong in a fresh copy,
      # since every stamp it reads was written seconds ago by the script rather
      # than by a person.
      - name: The generated manuscript is already clean
        working-directory: ${{ runner.temp }}/generated
        run: |
          test -f paper.pdf || { echo "no paper.pdf was built"; exit 1; }
          just check
          just version

  # The audiobook toolchain, on the platform it could not run on until piper
  # became a uv dependency. macos-latest is arm64, which is exactly the case the
  # old curl'd tarball had no build for -- so this job is the claim in the
  # README ("Linux, both Macs, and Windows") rather than a restatement of it.
  #
  # Deliberately does not build an .m4b: that needs ffmpeg and several minutes of
  # synthesis. What is being tested is that the engine installs and speaks.
  audio:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tools go in a user-owned directory rather than /usr/local/bin, which is
      # not reliably writable across the runner images (and differs again on an
      # arm64 macOS runner). BIN is exported for the install steps below.
      - name: Prepare a bin directory
        run: |
          echo "BIN=$HOME/.local/bin" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install just
        run: |
          curl -sSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-$( [ "$RUNNER_OS" = macOS ] && echo aarch64-apple-darwin || echo x86_64-unknown-linux-musl ).tar.gz" \
            | tar -xz -C "$BIN" just

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: just audio-setup

      # Synthesis has to be asserted on the samples, not on the exit code. Piper
      # writes a well-formed WAV either way, and a silent one is what a broken
      # phonemizer or a half-downloaded model produces.
      - name: Piper actually speaks
        run: |
          uv run --quiet --group audio python - <<'PY'
          import array, sys, wave
          from pathlib import Path
          sys.path.insert(0, "audio")
          import config
          from piper import PiperVoice

          voice = PiperVoice.load(Path("audio/models") / f"{config.VOICE_NAME}.onnx")
          out = Path("probe.wav")
          with wave.open(str(out), "wb") as wf:
              voice.synthesize_wav("The treated group scored one point one over control.", wf)

          with wave.open(str(out)) as w:
              rate, frames = w.getframerate(), w.getnframes()
              a = array.array("h")
              a.frombytes(w.readframes(frames))
          secs = frames / rate
          rms = (sum(int(x) * int(x) for x in a) / len(a)) ** 0.5
          print(f"  {rate} Hz, {secs:.1f}s, rms={rms:.0f}")
          if secs < 1.0:
              sys.exit(f"FAIL: {secs:.1f}s of audio for a full sentence")
          if rms < 100:
              sys.exit(f"FAIL: rms {rms:.0f} -- this is silence")
          print("  piper speaks")
          PY
