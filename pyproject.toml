[project]
name = "paper-scaffold"
# The toolchain release. A paper pins it in its own pyproject.toml
# (docs/package.md); `paper version` and the lock say which one it runs.
# See HISTORY.md for what bumps major, minor, and patch.
version = "5.3.1"
description = "The paper-scaffold manuscript toolchain: tools, gates and `paper sync`"
requires-python = ">=3.10"

# The manuscript toolchain. Small, stable, and the same for every project that
# uses this scaffold, which is why it is locked (uv.lock is committed) and why the
# analysis keeps its own separate environment in analysis/pyproject.toml. Project
# analysis dependencies change constantly and would make this lock meaningless.
dependencies = [
  'tomli; python_version < "3.11"',  # TOML reader on the supported Python floor
  "pypandoc-binary",  # Word export: bundles pandoc, so no system install
  "cairosvg",         # rasterizes math SVGs for the Word path
  "pillow",           # crops those rasters to their ink
  "textstat",         # sharper syllable counts for the readability report
  "codespell",        # the misspelling dictionary the spelling check reads
  "matplotlib",       # just viz: the manuscript diagnostics in viz/
  "wordcloud",        # just viz: the word cloud, which is for fun
  "bibtexparser>=2.0.0b2",  # bibliography checks. v2 is a beta and its API is
                      # incompatible with v1, so the floor is pinned deliberately.
  "rich",             # the console reports (word count, readability, density).
                      # Renders plain when piped, so CI logs stay greppable.
]

# Only needed to build the audiobooks. `just audio-setup` installs it.
# Kept out of the default set so a clone that never touches audio stays light.
[dependency-groups]
audio = [
  "piper-tts>=1.6",   # offline TTS. >=1.6 for the abi3 wheels: Linux, both
                      # Macs and Windows, and every Python from 3.9 up. Earlier
                      # releases were per-version wheels with no arm64 Mac build,
                      # which is why this used to be a curl'd Linux binary.
  "imageio-ffmpeg",   # self-contained ffmpeg binary, no system install
  "pillow",
  "matplotlib",       # cover art
]

[project.scripts]
paper = "paper_scaffold.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package is small (src/paper_scaffold); everything a paper runs or reads
# is package data under paper_scaffold/data/, laid out as in this repository so
# tools/paths.py finds it the same way in both (docs/package.md). An editable
# install has no data/ and reads the repository itself.
[tool.hatch.build.targets.wheel]
packages = ["src/paper_scaffold"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"tools" = "paper_scaffold/data/tools"
"tests" = "paper_scaffold/data/tests"
"journals" = "paper_scaffold/data/journals"
"word" = "paper_scaffold/data/word"
"docs" = "paper_scaffold/data/docs"
"vocab" = "paper_scaffold/data/vocab"
"justfile" = "paper_scaffold/data/justfile"
"HISTORY.md" = "paper_scaffold/data/HISTORY.md"
"stats.typ" = "paper_scaffold/data/stats.typ"
"assets.typ" = "paper_scaffold/data/assets.typ"
"code.typ" = "paper_scaffold/data/code.typ"
"wordcount.typ" = "paper_scaffold/data/wordcount.typ"
"wordcount-sections.typ" = "paper_scaffold/data/wordcount-sections.typ"
"slides/theme.typ" = "paper_scaffold/data/slides/theme.typ"
"analysis/scripts/_stats.py" = "paper_scaffold/data/analysis/scripts/_stats.py"
"analysis/scripts/_assets.py" = "paper_scaffold/data/analysis/scripts/_assets.py"
"analysis/scripts/_provenance.py" = "paper_scaffold/data/analysis/scripts/_provenance.py"
# The fixture check (`paper test`) runs the package's audio/ extractor, whose
# config.py reads the title and authors from ../config.typ: the scaffold's
# placeholder one, never a paper's.
"config.typ" = "paper_scaffold/data/config.typ"
"audio/config.py" = "paper_scaffold/data/audio/config.py"
"audio/extract_prose.py" = "paper_scaffold/data/audio/extract_prose.py"
"audio/make_audiobook.py" = "paper_scaffold/data/audio/make_audiobook.py"
"audio/make_cover.py" = "paper_scaffold/data/audio/make_cover.py"
