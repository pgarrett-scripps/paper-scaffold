# Journal of the American Society for Mass Spectrometry (ACS), Article.
#
# Every number here was read from the source below on the date in `checked`,
# and the source printed the date in `guidelines-dated`. Do not edit a limit
# from memory: re-read the source, change the number, and move `checked`.
# `just journals` lists the profiles; `just journal` reports this one against
# the manuscript. The words quoted under [notes] are the journal's own.
schema_version = 1
label = "JASMS Article"
journal = "Journal of the American Society for Mass Spectrometry"
type = "Article"
source = "https://researcher-resources.acs.org/publish/author_guidelines?coden=jamsef"
guidelines-dated = "2026-08-27"
checked = "2026-09-22"

[words]
# The guidelines set no word limit for an Article.
abstract-max = 250

[floats]
figures-max = 8   # main text; "seek permission from the editor" for more

[figures]
min-dpi = 300   # color art; line art 1200 dpi, grayscale 600 dpi

[graphical-abstract]
required = true
width-in = 3.25
height-in = 1.75
min-dpi = 300
# The standalone upload `just toc-graphic` writes. ACS also accepts EPS.
file-format = "tif"
label = "For Table of Contents Only"
source = "https://pubsapp.acs.org/paragonplus/submission/toc_abstract_graphics_guidelines.pdf"
guidelines-dated = "2024-02-28"

[notes]
abstract = "Provide an abstract no longer than 250 words for an Article, Short Communication, Note, and Perspective."
floats = "Restrict the number of figures for a full article to eight, and to three for a communication or note (seek permission from the editor if you require a greater number of figures)."
figures = "Single-column graphics can be sized up to 240 points wide (3.33 in.) and double-column graphics must be sized between 300 and 504 points (4.167 in. and 7 in.). Lettering should be no smaller than 4.5 points in the final published format."
graphical-abstract = "Submit the graphic at the actual size to be used for the TOC so that it will fit in an area no larger than 3.25 inches by 1.75 inches. Label the graphic \"For Table of Contents Only\" and provide it on the last page of the submitted manuscript."
graphical-abstract-file = "The graphic file should be saved as either: TIF at 300 dpi for color and at 1200 dpi for black and white. EPS in RGB document color mode with all fonts converted to outlines or embedded in the file."
