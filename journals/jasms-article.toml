# Journal of the American Society for Mass Spectrometry (ACS), Article.
#
# Every number here was read from the source below on the date in `checked`,
# and the source printed the date in `guidelines-dated`. Do not edit a limit
# from memory: re-read the source, change the number, and move `checked`.
# `just journals` lists the profiles; `just journal` reports this one against
# the manuscript. The words quoted under [notes] are the journal's own.
schema_version = 1
label = "JASMS Article"
journal = "Journal of the American Society for Mass Spectrometry"
type = "Article"
source = "https://researcher-resources.acs.org/publish/author_guidelines?coden=jamsef"
guidelines-dated = "2026-08-27"
checked = "2026-09-22"

[words]
# The guidelines set no word limit for an Article.
abstract-max = 250

[floats]
figures-max = 8   # main text; "seek permission from the editor" for more

[figures]
min-dpi = 300   # color art; line art 1200 dpi, grayscale 600 dpi
# From the quoted [notes].figures: "up to 240 points wide (3.33 in.)",
# "between 300 and 504 points (4.167 in. and 7 in.)", "no smaller than 4.5
# points". `just check-layout` reads them against assets.json's print sizes.
single-column-in = 3.33
double-column-min-in = 4.167
double-column-max-in = 7.0
min-type-pt = 4.5

[graphical-abstract]
required = true
width-in = 3.25
height-in = 1.75
min-dpi = 300
# The standalone upload `just toc-graphic` writes. ACS also accepts EPS.
file-format = "tif"
label = "For Table of Contents Only"
source = "https://pubsapp.acs.org/paragonplus/submission/toc_abstract_graphics_guidelines.pdf"
guidelines-dated = "2024-02-28"

[cover-letter]
# Read from the "Cover Letter" and "Preprint Servers" sections of the source.
# The guidelines set no word or page limit for the letter, so none is given;
# it is a separate upload (typed, pasted or attached). `required` lists what
# the letter "should contain"; /paper:cover-letter checks it, the gate does
# not. "preprint" applies only if a draft was deposited; "length" and
# "editor-discussion" are the items authors "should note".
required = ["title", "corresponding-author", "other-authors", "journal-fit",
            "supporting-information", "suggested-reviewers", "preprint",
            "prior-work", "length", "editor-discussion"]
reviewers-min = 4   # "four or more individuals competent to review"
source = "https://researcher-resources.acs.org/publish/author_guidelines?coden=jamsef"
guidelines-dated = "2026-08-27"
checked = "2026-09-25"

[notes]
abstract = "Provide an abstract no longer than 250 words for an Article, Short Communication, Note, and Perspective."
floats = "Restrict the number of figures for a full article to eight, and to three for a communication or note (seek permission from the editor if you require a greater number of figures)."
figures = "Single-column graphics can be sized up to 240 points wide (3.33 in.) and double-column graphics must be sized between 300 and 504 points (4.167 in. and 7 in.). Lettering should be no smaller than 4.5 points in the final published format."
graphical-abstract = "Submit the graphic at the actual size to be used for the TOC so that it will fit in an area no larger than 3.25 inches by 1.75 inches. Label the graphic \"For Table of Contents Only\" and provide it on the last page of the submitted manuscript."
graphical-abstract-file = "The graphic file should be saved as either: TIF at 300 dpi for color and at 1200 dpi for black and white. EPS in RGB document color mode with all fonts converted to outlines or embedded in the file."
cover-letter = "A cover letter must accompany every manuscript submission. During the submission process, you may type it or paste it into the submission system, or you may attach it as a file. A letter should contain the following elements: the full manuscript title; the name of the corresponding author and that person's complete contact information (mailing address, phone, and email); the name(s) of any other author(s); a statement of why the paper is appropriate for Journal of the American Society for Mass Spectrometry; a description of any Supporting Information for Publication and/or for Review Only Material; four or more individuals competent to review the manuscript (and their contact information); If an initial draft of the manuscript has been deposited on a recognized preprint server such as ChemRxiv, bioRxiv, arXiv, please include a link to the preprint, and as appropriate, state how the manuscript has been adjusted/updated between deposition and submission; and, any other related or prior work that should be disclosed to the Editor in advance. Additionally, authors should note any length issues, whether the manuscript was discussed with an Editor before submission, and other issues important for the review process."
cover-letter-prior-work = "In addition, an author must inform the Editor of prior dissemination of the content in print or electronic formats in the cover letter."
