# Journal of Proteome Research (ACS), Article.
#
# Every number here was read from the source below on the date in `checked`,
# and the source printed the date in `guidelines-dated`. Do not edit a limit
# from memory: re-read the source, change the number, and move `checked`.
# `just journals` lists the profiles; `just journal` reports this one against
# the manuscript. The words quoted under [notes] are the journal's own.
schema_version = 1
label = "JPR Article"
journal = "Journal of Proteome Research"
type = "Article"
source = "https://researcher-resources.acs.org/publish/author_guidelines?coden=jprobs"
guidelines-dated = "2026-08-27"
checked = "2026-09-22"

[words]
main-max = 8000
# Roles the journal leaves out of the count. journal.toml says which section
# of THIS manuscript plays each role. Acknowledgments, the SI availability
# statement and the reference list sit outside the BODY markers and are never
# counted, so only the experimental section needs mapping.
excludes = ["methods"]
abstract-max = 200
keywords-max = 10

[floats]
# The guidelines set no figure or table count for an Article.

[figures]
min-dpi = 300   # color art; line art 1200 dpi, grayscale 600 dpi

[graphical-abstract]
required = true
width-in = 3.25
height-in = 1.75
min-dpi = 300
# The standalone upload `just toc-graphic` writes. ACS also accepts EPS.
file-format = "tif"
label = "For Table of Contents Only"
source = "https://pubsapp.acs.org/paragonplus/submission/toc_abstract_graphics_guidelines.pdf"
guidelines-dated = "2024-02-28"

[cover-letter]
# Read from the "Cover Letter" and "Preprint Servers" sections of the source.
# The guidelines set no word or page limit for the letter, so none is given;
# it is a separate upload (typed, pasted or attached). `required` lists what
# the letter "should contain"; /paper:cover-letter checks it, the gate does
# not. "preprint" applies only if a draft was deposited; "length" and
# "editor-discussion" are the items authors "should note".
required = ["corresponding-author", "other-authors", "title", "journal-fit",
            "supporting-information", "preprint", "length", "editor-discussion"]
source = "https://researcher-resources.acs.org/publish/author_guidelines?coden=jprobs"
guidelines-dated = "2026-08-27"
checked = "2026-09-25"

[notes]
words = "Articles should not exceed 8,000 words. The word count limit does not include the experimental section, acknowledgments, supporting information availability statement, and list of references."
abstract = "All manuscripts must contain an Abstract (200 words maximum)."
keywords = "Author(s) should supply no more than 10 keywords per manuscript."
figures = "Digital graphics pasted into manuscripts should have the following minimum resolutions: black and white line art, 1200 dpi; grayscale art, 600 dpi; color art, 300 dpi."
graphical-abstract = "Submit the graphic at the actual size to be used for the TOC so that it will fit in an area no larger than 3.25 inches by 1.75 inches. Label the graphic \"For Table of Contents Only\" and provide it on the last page of the submitted manuscript."
graphical-abstract-file = "The graphic file should be saved as either: TIF at 300 dpi for color and at 1200 dpi for black and white. EPS in RGB document color mode with all fonts converted to outlines or embedded in the file."
cover-letter = "A cover letter must accompany every manuscript submission. During the submission process, you may type it or paste it into the submission system, or you may attach it as a file. A letter should contain the following elements: the name of the Corresponding Author and that person's complete contact information (mailing address, phone, and e-mail); the name(s) of any other author(s); the full manuscript title; a statement of why the paper is appropriate for Journal of Proteome Research; and a description of any Supporting Information for Publication and/or for Review Only Material. Additionally, author(s) should note any length issues, whether the manuscript was discussed with an Editor before submission, and other issues important for the review process."
cover-letter-preprint = "Please note any use of a preprint server in the cover letter and include a link to the preprint, and as appropriate, state how the manuscript has been adjusted/updated between deposition and submission."
cover-letter-length = "We recognize there are situations where a longer submission may be justified. In these cases, we ask that you include justification details supporting the extra length in your cover letter to the Editor."
