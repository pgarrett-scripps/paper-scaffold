# Per-project exceptions to the checks in prose_check.py.
#
# STYLE.md is the policy a person reads. This is the machine-checkable subset
# plus the exceptions this particular manuscript has earned. Every entry should
# be one a reviewer would accept, so write the reason next to it.
#
# `just prose-check --list-rules` prints every rule id and how to suppress it.
# `just prose-check --show-suppressed` lists what this file is currently hiding,
# which is worth running occasionally so nothing rots behind a suppression.

# Rules switched off entirely. Use this only for rules with no per-value form,
# such as semicolon-count. Prefer [allow] for anything narrower.
disable = []

# Values that are fine in this manuscript, per rule. Matching is
# case-insensitive on the value the finding names.
[allow]
# An acronym so standard in this field that expanding it would read oddly.
unexpanded-acronym = [
  "SI",   # Supporting Information, defined by the section it names
]

# A British spelling that is really a name, a quotation, or a product.
# british-spelling = ["Grey"]   # a surname

# A word codespell calls a typo that is really a term, a name, or a quotation.
# The list is curated and rarely wrong, so check the word before adding it.
# misspelling = ["Nd"]   # an element symbol, not a typo of "and"

# A phrase flagged as verbose but quoted from a source, or a term of art.
# verbose-phrase = ["essentially"]

# A figure or table legitimately cited before its number, usually from a
# conventions or overview paragraph that forward-references.
# reference-order = ["fig:si-example"]

# A reference deliberately kept but not cited, or an entry whose DOI genuinely
# does not exist. Prefer deleting an uncited entry to allowing it.
# uncited-reference = ["somekey"]
# missing-doi = ["somekey"]   # a preprint or dataset with no DOI issued

# A figure or table cited only from somewhere the checker does not read.
# uncited-figure = ["fig:example"]

# Thresholds. Omit any you are happy with.
[limits]
max-sentence-words = 40   # flags a run-on; STYLE.md aims for 25
opener-run = 3            # consecutive sentences opening with the same word
repeat-in-sentence = 3    # times a distinctive word may repeat in one sentence
# min-figure-dpi = 300         # effective resolution AS PRINTED, not as stored
# figure-text-width-mm = 160   # what a `width: 100%` figure spans. Measure it with
#                              #   #layout(size => [#metadata(size.width.inches())])
#                              # and `typst query`. A wrong value here silently
#                              # skews every dpi the figure check reports.
# max-table-columns = 8
# max-table-rows = 40
# max-cell-chars = 60

# Re-rate a rule for this project. The shipped severities are a default, not a
# judgement: whether a rule should stop a build depends on the project and on how
# close it is to submission. Only "error" and "warn" -- to switch a rule off
# entirely, put it in `disable` above.
[severity]
# long-sentence = "error"   # tighten before submission
# em-dash = "warn"          # a house style that tolerates them

# Teach the checker this field's vocabulary instead of switching a rule off
# because its shipped list does not fit. `add` extends, `remove` subtracts.
#
# [vocabulary.verbose-phrase]
# add = { "leverage" = "use" }
# remove = ["essentially"]     # load-bearing in this field, not filler
#
# [vocabulary.british-spelling]
# add = { "kilometre" = "kilometer" }
# remove = ["grey"]            # a surname that appears throughout
#
# [vocabulary.common-words]
# add = ["denoise", "filter"]  # too central here to count as a repetition
#
# [vocabulary.abbreviations]
# add = ["PASEF.", "approx."]  # periods that do not end a sentence
